<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QWebMap has moved</title>
<script>
  // The QWebMap repository was renamed from QGIS2VectorTiles: its GitHub Pages
  // site moved from /QGIS2VectorTiles/ to /QWebMap/. Old links (also deep
  // links and embedded demo maps such as /QGIS2VectorTiles/demo/?embed) go
  // to the same place under the new address.
  (function () {
    var old = /^\/QGIS2VectorTiles(\/|$)/i;
    var path = location.pathname;
    if (old.test(path)) {
      location.replace(path.replace(old, "/QWebMap$1") + location.search + location.hash);
    }
  })();
</script>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 48px 16px; color: #1d2a33; background: #fff; }
  main { max-width: 36rem; margin: 0 auto; }
  a { color: #1565c0; }
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>QWebMap, the QGIS web map plugin, is at
    <a href="https://danzig666.github.io/QWebMap/">danzig666.github.io/QWebMap</a>
    (source: <a href="https://github.com/danzig666/QWebMap">github.com/danzig666/QWebMap</a>).</p>
</main>
</body>
</html>
